name: Deploy Trading Bot to Hetzner

on:
  push:
    branches:
      - main  # Triggers when code is merged or pushed to main

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            # Navigate to project directory
            cd /root/app

            # Fetch and reset hard to origin/main to prevent local git merge conflicts
            git fetch origin main
            git reset --hard origin/main

            # Force rebuild without layer cache & recreate containers
            docker compose build --no-cache
            docker compose up -d --force-recreate --remove-orphans

            # Clean up dangling images and unused build cache
            docker image prune -f
            docker builder prune -f