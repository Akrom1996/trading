version: '3.8'

services:
  bot-sol:
    build: .
    container_name: bot-sol
    environment:
      - SYMBOL=SOL/USDT
      - DB_PATH=/app/data/bot_data.db
    env_file:
      - .env   # TELEGRAM_TOKEN, BINANCE keys, etc -- shared secrets
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m

  bot-zec:
    build: .
    container_name: bot-zec
    environment:
      - SYMBOL=ZEC/USDT
      - DB_PATH=/app/data/bot_data.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m

  bot-dash:
    build: .
    container_name: bot-dash
    environment:
      - SYMBOL=DASH/USDT
      - DB_PATH=/app/data/bot_data.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m

  # Dedicated automated daily report service
  daily-reporter:
    build: .
    command: python reporter_service.py
    environment:
      - DB_PATH=/app/data/bot_data.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always